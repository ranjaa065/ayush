<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{
font-family: 'Poppins', sans-serif;
}

body{
margin:0;
overflow:hidden;
background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
background-size: 400% 400%;
animation: gradientShift 15s ease infinite;
position: relative;
}

@keyframes gradientShift {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Floating flowers with blur and scale */

.flower{
position: absolute;
font-size: 28px;
will-change: transform;
animation: flowerFloat linear infinite;
pointer-events: none;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
}

@keyframes flowerFloat{
0%{
transform: translate3d(0, 120vh, 0) rotate(0deg) scale(0.5);
opacity: 0;
filter: blur(2px);
}
10%{
opacity: 1;
filter: blur(0px);
}
50%{
transform: translate3d(var(--drift, 20px), 50vh, 0) rotate(180deg) scale(1);
}
90%{
opacity: 1;
filter: blur(0px);
}
100%{
transform: translate3d(calc(var(--drift, 20px) * -1), -20vh, 0) rotate(360deg) scale(0.5);
opacity: 0;
filter: blur(2px);
}
}

/* Fireworks bursting animation */

.firework{
position: absolute;
pointer-events: none;
}

.firework-particle{
position: absolute;
width: 6px;
height: 6px;
border-radius: 50%;
animation: explode 1.5s ease-out forwards;
}

@keyframes explode{
0%{
transform: translate(0, 0) scale(1);
opacity: 1;
}
100%{
transform: translate(var(--x), var(--y)) scale(0);
opacity: 0;
}
}

.firework-trail{
position: absolute;
width: 4px;
height: 40px;
background: linear-gradient(to top, transparent, white);
animation: launch 0.8s ease-out forwards;
}

@keyframes launch{
0%{
transform: translateY(0) scaleY(1);
opacity: 1;
}
100%{
transform: translateY(-150px) scaleY(0.5);
opacity: 0;
}
}

/* Enhanced confetti with physics */

.confetti{
position: absolute;
width: 10px;
height: 10px;
animation: confettiFall 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
border-radius: 2px;
box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

@keyframes confettiFall{
0%{
transform: translateY(-10vh) rotate(0deg) scale(1);
opacity: 1;
}
100%{
transform: translateY(110vh) rotate(720deg) scale(0.3);
opacity: 0;
}
}

/* 3D flower garden with glow */

.garden{
position: absolute;
top: 50%;
left: 50%;
transform-style: preserve-3d;
animation: rotateGarden 25s ease-in-out infinite;
perspective: 1000px;
}

@keyframes rotateGarden{
0%{
transform: translate(-50%, -50%) rotateY(0deg) rotateX(10deg);
}
50%{
transform: translate(-50%, -50%) rotateY(180deg) rotateX(-10deg);
}
100%{
transform: translate(-50%, -50%) rotateY(360deg) rotateX(10deg);
}
}

.garden span{
position: absolute;
font-size: 48px;
filter: drop-shadow(0 0 20px rgba(255,255,255,0.8));
animation: flowerPulse 2s ease-in-out infinite;
}

@keyframes flowerPulse{
0%, 100%{ transform: scale(1); }
50%{ transform: scale(1.2); }
}

/* Floating hearts */

.heart{
position: absolute;
font-size: 20px;
animation: heartFloat 6s ease-in-out infinite;
pointer-events: none;
opacity: 0.7;
}

@keyframes heartFloat{
0%{
transform: translateY(100vh) rotate(0deg) scale(0);
opacity: 0;
}
20%{
opacity: 0.8;
transform: translateY(80vh) rotate(45deg) scale(1);
}
80%{
opacity: 0.8;
}
100%{
transform: translateY(-20vh) rotate(180deg) scale(0);
opacity: 0;
}
}

/* Sparkle effect */

.sparkle{
position: absolute;
width: 3px;
height: 3px;
background: white;
border-radius: 50%;
animation: sparkleAnim 2s ease-in-out infinite;
pointer-events: none;
box-shadow: 0 0 10px white, 0 0 20px white;
}

@keyframes sparkleAnim{
0%, 100%{ opacity: 0; transform: scale(0); }
50%{ opacity: 1; transform: scale(1.5); }
}

/* Modern card animations */

.card-container{
animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat{
0%, 100%{ transform: translateY(0px); }
50%{ transform: translateY(-10px); }
}

.title-gradient{
background: linear-gradient(45deg, #ff6b9d, #c44569, #ff6b9d);
background-size: 200% auto;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
animation: shimmer 3s linear infinite;
}

@keyframes shimmer{
0%{ background-position: 0% center; }
100%{ background-position: 200% center; }
}

/* Button ripple effect */

.btn-celebrate{
position: relative;
overflow: hidden;
}

.btn-celebrate::before{
content: '';
position: absolute;
top: 50%;
left: 50%;
width: 0;
height: 0;
border-radius: 50%;
background: rgba(255,255,255,0.5);
transform: translate(-50%, -50%);
transition: width 0.6s, height 0.6s;
}

.btn-celebrate:hover::before{
width: 300px;
height: 300px;
}

/* Shooting stars */

.shooting-star{
position: absolute;
width: 2px;
height: 2px;
background: white;
border-radius: 50%;
box-shadow: 0 0 8px 2px white;
animation: shootingStar 2s ease-out infinite;
pointer-events: none;
}

@keyframes shootingStar{
0%{
transform: translate(0, 0) scale(1);
opacity: 1;
}
70%{
opacity: 1;
}
100%{
transform: translate(var(--shoot-x, -200px), var(--shoot-y, 200px)) scale(0);
opacity: 0;
}
}

.shooting-star::after{
content: '';
position: absolute;
top: 0;
left: 0;
width: 50px;
height: 2px;
background: linear-gradient(to right, white, transparent);
transform: translateX(-100%) rotate(-45deg);
box-shadow: 0 0 10px white;
}

/* Bubbles */

.bubble{
position: absolute;
border-radius: 50%;
background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
border: 2px solid rgba(255,255,255,0.5);
animation: bubbleFloat 8s ease-in-out infinite;
pointer-events: none;
box-shadow: inset 0 0 20px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3);
}

@keyframes bubbleFloat{
0%{
transform: translateY(100vh) translateX(0) scale(0.5);
opacity: 0;
}
10%{
opacity: 0.8;
}
50%{
transform: translateY(50vh) translateX(var(--wobble, 30px)) scale(1);
}
90%{
opacity: 0.8;
}
100%{
transform: translateY(-10vh) translateX(0) scale(0.3);
opacity: 0;
}
}

/* Pulsing rings */

.pulse-ring{
position: absolute;
border: 3px solid;
border-radius: 50%;
animation: pulseRing 3s ease-out infinite;
pointer-events: none;
}

@keyframes pulseRing{
0%{
transform: scale(0);
opacity: 1;
}
100%{
transform: scale(3);
opacity: 0;
}
}

/* Butterflies */

.butterfly{
position: absolute;
font-size: 30px;
animation: butterflyFly 15s ease-in-out infinite;
pointer-events: none;
filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
}

@keyframes butterflyFly{
0%{
transform: translate(0, 100vh) rotate(0deg) scale(0.8);
opacity: 0;
}
10%{
opacity: 1;
}
25%{
transform: translate(var(--fly-x1, 100px), 70vh) rotate(20deg) scale(1);
}
50%{
transform: translate(var(--fly-x2, -50px), 40vh) rotate(-15deg) scale(1.1);
}
75%{
transform: translate(var(--fly-x3, 80px), 20vh) rotate(25deg) scale(0.9);
}
90%{
opacity: 1;
}
100%{
transform: translate(var(--fly-x4, 0), -10vh) rotate(0deg) scale(0.7);
opacity: 0;
}
}

/* Glowing orbs */

.glowing-orb{
position: absolute;
width: 60px;
height: 60px;
border-radius: 50%;
background: radial-gradient(circle, var(--orb-color, #ff6b9d), transparent);
filter: blur(10px);
animation: orbFloat 10s ease-in-out infinite;
pointer-events: none;
opacity: 0.6;
}

@keyframes orbFloat{
0%, 100%{
transform: translate(0, 0) scale(1);
}
25%{
transform: translate(var(--orb-x1, 100px), var(--orb-y1, -80px)) scale(1.3);
}
50%{
transform: translate(var(--orb-x2, -80px), var(--orb-y2, 60px)) scale(0.8);
}
75%{
transform: translate(var(--orb-x3, 120px), var(--orb-y3, -40px)) scale(1.2);
}
}

/* Star twinkle */

.star-twinkle{
position: absolute;
font-size: 16px;
animation: starTwinkle 3s ease-in-out infinite;
pointer-events: none;
}

@keyframes starTwinkle{
0%, 100%{
opacity: 0.3;
transform: scale(0.8) rotate(0deg);
}
50%{
opacity: 1;
transform: scale(1.2) rotate(180deg);
}
}

/* Login screen styles */

.login-container{
backdrop-filter: blur(20px);
animation: fadeIn 1s ease-in;
}

@keyframes fadeIn{
0%{ opacity: 0; transform: scale(0.9); }
100%{ opacity: 1; transform: scale(1); }
}

.input-code{
background: rgba(255,255,255,0.2);
border: 2px solid rgba(255,255,255,0.3);
color: white;
padding: 16px 24px;
border-radius: 50px;
font-size: 18px;
text-align: center;
transition: all 0.3s ease;
outline: none;
letter-spacing: 4px;
}

.input-code::placeholder{
color: rgba(255,255,255,0.6);
letter-spacing: 2px;
}

.input-code:focus{
border-color: rgba(255,255,255,0.8);
background: rgba(255,255,255,0.3);
box-shadow: 0 0 30px rgba(255,255,255,0.5);
transform: scale(1.05);
}

.error-shake{
animation: shake 0.5s ease;
}

@keyframes shake{
0%, 100%{ transform: translateX(0); }
25%{ transform: translateX(-10px); }
75%{ transform: translateX(10px); }
}

.lock-icon{
font-size: 80px;
animation: lockPulse 2s ease-in-out infinite;
}

@keyframes lockPulse{
0%, 100%{ transform: scale(1); }
50%{ transform: scale(1.1); }
}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function FloatingFlowers(){

const flowers=["🌸","🌺","🌷","🌹","💐","🏵️"]
const items=new Array(15).fill(null)

return items.map((_,i)=>(
<div
key={i}
className="flower"
style={{
left:Math.random()*100+"%",
animationDuration:(10+Math.random()*8)+"s",
animationDelay:(Math.random()*10)+"s",
"--drift": (Math.random()*100-50)+"px"
}}
>
{flowers[Math.floor(Math.random()*flowers.length)]}
</div>
))

}

function Fireworks(){

const [bursts, setBursts] = React.useState([])

React.useEffect(() => {
const interval = setInterval(() => {
const x = Math.random() * window.innerWidth
const y = Math.random() * (window.innerHeight * 0.6) + window.innerHeight * 0.1
const color = `hsl(${Math.random() * 360}, 100%, 60%)`
const id = Date.now() + Math.random()

setBursts(prev => [...prev, { id, x, y, color }])

setTimeout(() => {
setBursts(prev => prev.filter(b => b.id !== id))
}, 1500)

}, 1200)

return () => clearInterval(interval)
}, [])

return bursts.map(burst => {
const particles = 30
return (
<div key={burst.id} className="firework" style={{ left: burst.x, top: burst.y }}>
{[...Array(particles)].map((_, i) => {
const angle = (360 / particles) * i
const distance = 80 + Math.random() * 40
const x = Math.cos(angle * Math.PI / 180) * distance
const y = Math.sin(angle * Math.PI / 180) * distance
return (
<div
key={i}
className="firework-particle"
style={{
background: burst.color,
boxShadow: `0 0 10px ${burst.color}`,
'--x': `${x}px`,
'--y': `${y}px`,
animationDelay: `${i * 0.01}s`
}}
/>
)
})}
</div>
)
})

}

function Hearts(){

return [...Array(8)].map((_,i)=>(
<div
key={i}
className="heart"
style={{
left:Math.random()*100+"%",
animationDelay:(Math.random()*5)+"s",
animationDuration:(5+Math.random()*3)+"s"
}}
>
💖
</div>
))

}

function Sparkles(){

return [...Array(20)].map((_,i)=>(
<div
key={i}
className="sparkle"
style={{
left:Math.random()*100+"%",
top:Math.random()*100+"%",
animationDelay:(Math.random()*2)+"s"
}}
></div>
))

}

function ShootingStars(){

return [...Array(5)].map((_,i)=>(
<div
key={i}
className="shooting-star"
style={{
left:Math.random()*100+"%",
top:Math.random()*50+"%",
animationDelay:(Math.random()*5)+"s",
animationDuration:(1.5+Math.random())+"s",
"--shoot-x": (-150-Math.random()*100)+"px",
"--shoot-y": (150+Math.random()*100)+"px"
}}
></div>
))

}

function Bubbles(){

return [...Array(10)].map((_,i)=>{
const size = 30 + Math.random()*40
return(
<div
key={i}
className="bubble"
style={{
left:Math.random()*100+"%",
width:size+"px",
height:size+"px",
animationDelay:(Math.random()*6)+"s",
animationDuration:(6+Math.random()*4)+"s",
"--wobble": (Math.random()*100-50)+"px"
}}
></div>
)
})

}

function PulsingRings(){

const [rings, setRings] = React.useState([])

React.useEffect(() => {
const interval = setInterval(() => {
const x = Math.random() * window.innerWidth
const y = Math.random() * window.innerHeight
const color = `hsl(${Math.random() * 360}, 80%, 70%)`
const id = Date.now() + Math.random()

setRings(prev => [...prev, { id, x, y, color }])

setTimeout(() => {
setRings(prev => prev.filter(r => r.id !== id))
}, 3000)

}, 2000)

return () => clearInterval(interval)
}, [])

return rings.map(ring => (
<div
key={ring.id}
className="pulse-ring"
style={{
left: ring.x,
top: ring.y,
borderColor: ring.color,
width: '80px',
height: '80px',
marginLeft: '-40px',
marginTop: '-40px'
}}
/>
))

}

function Butterflies(){

const butterflies = ['🦋', '🦋', '🦋']

return butterflies.map((b,i)=>(
<div
key={i}
className="butterfly"
style={{
left:Math.random()*100+"%",
animationDelay:(Math.random()*8)+"s",
animationDuration:(12+Math.random()*6)+"s",
"--fly-x1": (Math.random()*200-100)+"px",
"--fly-x2": (Math.random()*200-100)+"px",
"--fly-x3": (Math.random()*200-100)+"px",
"--fly-x4": (Math.random()*200-100)+"px"
}}
>
{b}
</div>
))

}

function GlowingOrbs(){

const colors = ['#ff6b9d', '#c44569', '#f8b500', '#4a69bd', '#0abde3', '#ee5a6f']

return [...Array(6)].map((_,i)=>(
<div
key={i}
className="glowing-orb"
style={{
left:Math.random()*100+"%",
top:Math.random()*100+"%",
animationDelay:(Math.random()*5)+"s",
"--orb-color": colors[i],
"--orb-x1": (Math.random()*200-100)+"px",
"--orb-y1": (Math.random()*200-100)+"px",
"--orb-x2": (Math.random()*200-100)+"px",
"--orb-y2": (Math.random()*200-100)+"px",
"--orb-x3": (Math.random()*200-100)+"px",
"--orb-y3": (Math.random()*200-100)+"px"
}}
></div>
))

}

function StarTwinkles(){

return [...Array(15)].map((_,i)=>(
<div
key={i}
className="star-twinkle"
style={{
left:Math.random()*100+"%",
top:Math.random()*100+"%",
animationDelay:(Math.random()*3)+"s"
}}
>
⭐
</div>
))

}

function LoginScreen({ onLogin }){

const [code, setCode] = React.useState('')
const SECRET_CODE = '1511' // Change this to your desired secret code

const handleSubmit = (e) => {
e.preventDefault()
if(code.toUpperCase() === SECRET_CODE){
onLogin()
} else {
setCode('')
}
}

return(
<div className="login-container relative min-h-screen flex items-center justify-center px-4 overflow-hidden">

<div className="relative z-10 text-center">

<p className="text-white text-2xl font-light mb-6 drop-shadow-lg">
enter the code for suprise
</p>

<form onSubmit={handleSubmit}>
<input
type="text"
value={code}
onChange={(e) => setCode(e.target.value)}
placeholder=""
className="input-code"
autoFocus
/>
</form>

</div>

</div>
)

}

function FlowerGarden(){

const flowers=["🌷","🌹","🌺","🌸","🌼","🌻","💐","🏵️"]

return(

<div className="garden">

{flowers.map((f,i)=>{

const angle=(360/flowers.length)*i
const radius=160

return(
<span
key={i}
style={{
transform:`rotateY(${angle}deg) translateZ(${radius}px)`,
animationDelay:`${i*0.2}s`
}}
>
{f}
</span>
)

})}

</div>

)

}

function Confetti({show}){

if(!show) return null

const colors=['#ff6b9d','#c44569','#f8b500','#6a89cc','#4a69bd','#e55039','#b71540']

return [...Array(50)].map((_,i)=>(
<div
key={i}
className="confetti"
style={{
left:Math.random()*100+"%",
background:colors[Math.floor(Math.random()*colors.length)],
animationDelay:(Math.random()*0.5)+"s",
animationDuration:(3+Math.random()*2)+"s"
}}
></div>
))

}

function App(){

const [celebrateCount,setCelebrateCount]=React.useState(0)
const [isAuthenticated, setIsAuthenticated] = React.useState(false)

const handleCelebrate = () => {
setCelebrateCount(prev => prev + 1)
}

const handleLogin = () => {
setIsAuthenticated(true)
}

if(!isAuthenticated){
return <LoginScreen onLogin={handleLogin} />
}

return(

<div className="relative min-h-screen flex items-center justify-center px-4 overflow-hidden">

<div className="absolute inset-0 pointer-events-none">

<FlowerGarden/>
<Hearts/>
<Sparkles/>
<Fireworks/>
<ShootingStars/>
<Bubbles/>
<PulsingRings/>
<Butterflies/>
<GlowingOrbs/>
<StarTwinkles/>
{celebrateCount > 0 && <Confetti key={celebrateCount} show={true}/>}

</div>

<div className="card-container relative z-10 bg-white/20 backdrop-blur-2xl shadow-2xl rounded-3xl p-8 max-w-lg w-full text-center border border-white/30">

<h1 className="title-gradient text-5xl font-bold mb-6 animate-pulse">
Happy Women's Day 💖
</h1>

<div className="mb-6 relative group">
<div className="absolute inset-0 bg-gradient-to-r from-pink-400 to-purple-400 rounded-full blur-xl opacity-50 group-hover:opacity-75 transition-opacity"></div>
<img
src="indian.jpeg"
className="relative w-48 h-48 mx-auto rounded-full object-cover border-4 border-white/50 shadow-lg transform transition-transform duration-300 hover:scale-110"
alt="Celebration"
/>
</div>

<p className="text-white text-lg font-light leading-relaxed mb-6 drop-shadow-lg">
Women represent strength, kindness, intelligence and inspiration to me.
Today we celebrate the amazing women who make the world better. ✨
</p>

<button
onClick={handleCelebrate}
className="btn-celebrate mt-4 w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-semibold rounded-full hover:from-pink-600 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 shadow-xl hover:shadow-2xl"
>
Celebrate Women 🌸✨
</button>

</div>

</div>

)

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)

</script>

</body>
</html>
